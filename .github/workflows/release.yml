name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - name: Publish release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/release-notes.js > notes.md
          gh release delete "v$VERSION" --yes --cleanup-tag || true
          gh release create "v$VERSION" dist/*.exe dist/*.exe.blockmap dist/latest.yml \
            --title "M-Download $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
